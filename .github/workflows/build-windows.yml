name: Build Windows Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Windows desktop (x64 NSIS)
        # bundle.mjs 自包含：prepare:runtime-assets（agent bundle + native search）
        # → production build → electron-builder --win --x64 → 运行时依赖校验。
        # 签名未配置：产物为未签名 NSIS 安装包（构建日志会有警告，属预期）。
        run: pnpm --filter @zcode/desktop run bundle -- --os win --arch x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-windows-x64
          path: packages/desktop/dist/*.exe
          if-no-files-found: error
